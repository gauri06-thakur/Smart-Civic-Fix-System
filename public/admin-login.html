
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civic Fix | Admin Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #243047;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 8px 30px #152b4515;
    }

    h1 { margin-top: 0; color: #173b63; }
    p { color: #64748b; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 7px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message { margin-top: 16px; }
  </style>
</head>
<body>
  <main class="login-box">
    <h1>Civic Fix</h1>
    <p>Admin Login</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
        autocomplete="current-password" required>

      <button type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      message.textContent = "Checking login...";

      try {
        const response = await fetch(
                  "http://127.0.0.1:3000/api/admin/login",
       {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          message.textContent = result.message || "Login failed.";
          return;
        }

        message.textContent = "Login successful! Opening dashboard...";

        window.location.href = "admin.html";
      } catch (error) {
        message.textContent =
          "Cannot connect to server. Please start the backend.";
      }
    });
  </script>
</body>
</html>
